# EHR Blank/Junk page classifier (OCR text only)
# See configs/default.yaml and reports/ for dataset readiness.

python_requires = ">=3.10"

[project]
name = "b-jnk"
version = "0.3.0"
description = "OCR page flagger: KEEP / BLANK / JUNK (flagging only, no deletes)"

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn>=1.3",
  "scipy",
  "joblib",
  "pyyaml",
  "openpyxl",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
boosting = ["xgboost"]

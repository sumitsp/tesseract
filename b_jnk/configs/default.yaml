# Default config for OCR-text-only KEEP / BLANK / JUNK flagging.
# Nothing is deleted — pages are flagged for downstream review/routing.
# Safety rule: incorrectly flagging KEEP as BLANK/JUNK is far worse than
# leaving junk as KEEP.

paths:
  raw_jsonl: data/raw/ehr_pages_v0.3.jsonl
  label_map: data/labels/label_map_v0.3.json
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports

model_version: "bjc-ocr-v0.3.1"

routing:
  min_dictionary_words: 2
  # Empty OCR → KEEP + review_required (never auto-BLANK)
  empty_ocr_flag: KEEP

split:
  group_key: split_group
  test_size: 0.25
  random_state: 42
  max_pages_per_template_train: 10

training:
  require_train_eligible: true
  include_medium_keep: true
  # Cost ratio: KEEP→BLANK/JUNK vs reverse (class_weight multiplier)
  retain_delete_cost_ratio: 50.0

tfidf:
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  word_max_features: 40000
  char_max_features: 40000
  min_df: 1
  classifier: logistic_regression  # logistic_regression | linear_svc

embeddings:
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  classifier: logistic_regression

decision:
  min_flag_confidence: 0.70
  junk_blank_min_confidence: 0.85
  keep_veto_prob: 0.10
  # Protocol: clinical images + demographics never JUNK/BLANK
  enforce_retention_safeguards: true
  # Request / instructions / fax sheets quote DOB or MRN. BERT may overrule
  # demographic retention for those labels at >= 0.95 only when the page also has a
  # trigger phrase of that subtype. JUNK_INVOICE does not need the phrase: a billing
  # page always has a name and DOB, and the model call at >= 0.95 is the decision.
  # Clinical images are never overruled.
  demographic_override_labels: [JUNK_RECORD_REQUEST, JUNK_INSTRUCTIONS, JUNK_LETTER_FAX, JUNK_INVOICE]
  demographic_override_min_prob: 0.95
  demographic_override_needs_trigger: true  # confidence alone flagged an EMR index page
  demographic_override_no_trigger_labels: [JUNK_INVOICE]
  require_confident_subtype: true  # one label (not a sum of junk subtypes) must reach junk_blank_min_confidence

taxonomy:
  flags:
    - KEEP
    - BLANK
    - JUNK
  protocol: blank_junk_elimination_v1

# 8-label BERT (KEEP, BLANK, six JUNK subtypes). Trained on synthetic/checked/clean.jsonl
# plus real labelled pages; scripts/infer.py uses it when models/bert_page exists.
bert:
  base_model: distilbert-base-uncased
  model_dir: models/bert_page
  synthetic_clean: synthetic/checked/clean.jsonl
  max_length: 512
  head_share: 0.75       # share of tokens kept from the start of long pages; rest from the end
  epochs: 4
  batch_size: 8
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  keep_weight: 3.0       # loss weight on KEEP: losing a chart page costs more than missing junk
  real_copies: 3         # repeat each real training page so ~200 real pages count next to ~2,800 synthetic
  decide_short_pages: true  # BERT decides very short sheets (ACCEPT, scan marks); false = always KEEP + review
  seed: 42
